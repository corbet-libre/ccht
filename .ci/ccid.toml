schema = 1
project = "ccht"

[checks.core]
kind = "commands"
commands = [["cargo", "test", "--locked", "--no-default-features"], ["cargo", "check", "--locked", "--no-default-features", "--features", "web", "--target", "wasm32-unknown-unknown"]]

[checks.js-package]
kind = "commands"
commands = [["python3", ".ci/check_web.py"]]

[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]
all_features = true
toolchain = "system"

[checks.licenses]
kind = "commands"
commands = [["python3", ".ci/license_inventory.py"]]

[checks.rust-package]
kind = "commands"
commands = [["python3", ".ci/check_package.py"]]

[checks.jsr-package]
kind = "commands"
commands = [["python3", ".ci/check_jsr.py"]]

[checks.jsr-registry]
kind = "commands"
commands = [["python3", ".ci/check_jsr_registry.py"]]

[checks.python-package]
kind = "commands"
commands = [["python3", ".ci/check_python.py"]]

[checks.python-registry]
kind = "commands"
commands = [["python3", ".ci/check_python_registry.py"]]

[checks.python-prepare]
kind = "commands"
commands = [["python3", ".ci/check_python.py", "--resolve-only"]]

# Manual publication adapter; no product compilation occurs.
[checks.release]
kind = "commands"
commands = [["python3", ".ci/publish.py"]]

# Syntax and manual publication contract; no product build or network.
[checks.release-config]
kind = "commands"
commands = [["python3", ".ci/release-check.py"]]

# verify aggregates the cached subset of the hosted Linux route (ci.yml case branches):
# rust + rust-msrv + ccid-defined standalone packaging/integration selectors in dependency
# order. Registry/live-read selectors run FRESH after the cached verify via `ccid check`
# (never `cached`): published-npm/jsr/python (+ resolve-dependencies for cletter;
# licenses + jsr-registry + python-registry for ccht). Publication and artifact-manifest
# selectors (release, rust-dependencies, typst-preview, registry-resolved previews) stay
# defined and callable via the old ccid route; they are not in the default job.
# No cache_inputs (broad default); no cache_outputs (packaging receipts land in ARTIFACT_ROOT,
# outside the repo tree); no cache_env (no shells; dynamic paths must not key the cache).
# No deny.toml ships, so there is no advisories check; freshness is carried by the
# per-selector fresh checks above instead.

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["node", "--version"], ["npm", "--version"], ["deno", "--version"], ["uv", "--version"], ["patchelf", "--version"]]

[render]
tool_revision = "2db9dddd5e43d48b6cdbb2728818957db65acf5e"
tool_sha256 = "f5a672c714ca91a87e230713086379f06ad6df6d0ccd9112ee5fbf0cd44f95e7"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "licenses", "jsr-registry", "python-registry"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
